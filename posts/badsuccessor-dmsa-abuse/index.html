<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Ozan Bozkurt</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --sc-bg-1: #0b0f17;
                --sc-bg-2: #10161f;
                --sc-card: #131a24;
                --sc-border: #232c39;
                --sc-text: #e6edf3;
                --sc-muted: #8b98a9;
                --sc-accent: #38d9a9;
                --sc-accent-soft: rgba(56, 217, 169, 0.12);
                --sc-danger: #ff6b6b;
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: radial-gradient(circle at 50% -10%, var(--sc-bg-2), var(--sc-bg-1) 60%);
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Inter,
                    Helvetica,
                    Arial,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 380px;
                margin: 0 auto;
            }

            .staticrypt-form {
                position: relative;
                background: var(--sc-card);
                border: 1px solid var(--sc-border);
                border-radius: 16px;
                padding: 40px 32px;
                text-align: center;
                box-shadow:
                    0 20px 50px -20px rgba(0, 0, 0, 0.6),
                    0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            }

            .staticrypt-lock {
                width: 46px;
                height: 46px;
                margin: 0 auto 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                background: var(--sc-accent-soft);
                color: var(--sc-accent);
            }

            .staticrypt-lock svg {
                width: 22px;
                height: 22px;
            }

            .staticrypt-instructions {
                margin-bottom: 22px;
            }

            .staticrypt-title {
                font-size: 1.15em;
                font-weight: 600;
                color: var(--sc-text);
                margin: 0 0 6px;
                letter-spacing: -0.01em;
            }

            .staticrypt-instructions p:last-child {
                margin: 0;
                color: var(--sc-muted);
                font-size: 0.88em;
                line-height: 1.5;
            }

            .staticrypt-hr {
                display: none;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--sc-bg-1);
                width: 100%;
                border: 1px solid var(--sc-border);
                border-radius: 10px;
                margin: 0 0 14px;
                transition: border-color 0.15s ease;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--sc-accent);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                outline: 0;
                padding: 13px 42px 13px 14px;
                width: 100%;
                color: var(--sc-text);
            }

            .staticrypt-form input[type="password"]::placeholder,
            .staticrypt-form input[type="text"]::placeholder {
                color: var(--sc-muted);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.55;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1);
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.85;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: var(--sc-accent);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 13px;
                color: #06231b;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    filter 0.15s ease,
                    transform 0.05s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(1.08);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(1px);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin: 0 0 16px;
                color: var(--sc-muted);
                font-size: 0.85em;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 15px;
                height: 15px;
                accent-color: var(--sc-accent);
                margin: 0;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--sc-bg-1);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.2em solid var(--sc-border);
                border-right-color: var(--sc-accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
